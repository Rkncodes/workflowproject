server.port=8081
server.servlet.context-path=/api

spring.application.name=civicflow-backend

# Database Configuration (MySQL 8.0)
spring.datasource.url=jdbc:mysql://localhost:3306/civicflow_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Dhara@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Disable blocking auto-config, managed explicitly via ZeebeConfig & CamundaWorkflowManager
camunda.client.enabled=false
civicflow.camunda.zeebe.gateway=127.0.0.1:26500

# Custom Business Configuration
civicflow.permit.max-revisions=3
civicflow.rates.residential=20.0
civicflow.rates.commercial=40.0
civicflow.rates.industrial=30.0

# File Upload
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

logging.level.com.civicflow=INFO
